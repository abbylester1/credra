<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 580" width="1360" height="580" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title>Credra architecture</title>
  <desc>People use the Credra app; the app verifies invoices against a simulated registry and records verdicts on Whitechain through the verifier wallet; investors fund and repay in official USDT through ReceivableFinance.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M1 1.5 L9 5 L1 8.5" fill="none" stroke="#1B1B18" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M1 1.5 L9 5 L1 8.5" fill="none" stroke="#8A887F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1360" height="580" fill="#F6F5F2"/>
  <text x="48" y="52" font-size="25" font-weight="700" fill="#1B1B18" letter-spacing="-0.4">Credra architecture</text>
  <text x="48" y="74" font-size="14" fill="#6B6A63">Verify an invoice, fund it in USDT, settle to the receivable holder. Testnet.</text>

  <!-- People -->
  <g font-size="15">
    <rect x="48" y="130" width="210" height="66" rx="12" fill="#FFFFFF" stroke="#E2E0DA"/>
    <text x="70" y="162" font-weight="600" fill="#1B1B18">Business</text><text x="70" y="182" font-size="12.5" fill="#6B6A63">submits invoices</text>
    <rect x="48" y="212" width="210" height="66" rx="12" fill="#FFFFFF" stroke="#E2E0DA"/>
    <text x="70" y="244" font-weight="600" fill="#1B1B18">Investor</text><text x="70" y="264" font-size="12.5" fill="#6B6A63">allowlisted, funds in USDT</text>
    <rect x="48" y="294" width="210" height="66" rx="12" fill="#FFFFFF" stroke="#E2E0DA"/>
    <text x="70" y="326" font-weight="600" fill="#1B1B18">Operator</text><text x="70" y="346" font-size="12.5" fill="#6B6A63">reviews, manages allowlist</text>
  </g>

  <!-- App -->
  <rect x="330" y="118" width="430" height="300" rx="16" fill="#FBFAF8" stroke="#CFCCC4"/>
  <text x="354" y="148" font-size="15" font-weight="700" fill="#1B1B18">Credra app · Next.js</text>
  <g font-size="13.5" fill="#1B1B18">
    <rect x="354" y="162" width="382" height="46" rx="9" fill="#FFFFFF" stroke="#E2E0DA"/><text x="372" y="190" font-weight="500">UI, API routes and audit timeline</text>
    <rect x="354" y="216" width="382" height="46" rx="9" fill="#FFFFFF" stroke="#E2E0DA"/><text x="372" y="244" font-weight="500">Off-chain DB — SQLite local, Turso hosted</text>
    <rect x="354" y="270" width="382" height="46" rx="9" fill="#FFFFFF" stroke="#E2E0DA"/><text x="372" y="298" font-weight="500">Verifier wallet — server side only</text>
  </g>
  <rect x="354" y="330" width="382" height="72" rx="10" fill="#FFFFFF" stroke="#0D3B35" stroke-width="1.5"/>
  <text x="372" y="357" font-size="13.5" font-weight="700" fill="#0D3B35">Eligibility check</text>
  <text x="372" y="378" font-size="12.5" fill="#1B1B18">Chainlink CRE, or the same rules in-process when hosted.</text>
  <text x="372" y="394" font-size="12.5" fill="#6B6A63">Result: ELIGIBLE · REJECTED · MANUAL_REVIEW.</text>

  <!-- Simulated registry -->
  <rect x="372" y="470" width="346" height="62" rx="12" fill="#FFFFFF" stroke="#8A887F" stroke-dasharray="6 4"/>
  <text x="392" y="498" font-size="14" font-weight="600" fill="#1B1B18">Simulated external registry</text>
  <text x="392" y="518" font-size="12" fill="#6B6A63">mock API locally, a DB table when hosted — not real</text>

  <!-- Chain -->
  <rect x="900" y="118" width="412" height="300" rx="16" fill="#FBFAF8" stroke="#CFCCC4"/>
  <text x="1288" y="148" font-size="15" font-weight="700" fill="#1B1B18" text-anchor="end">Whitechain Sepolia · 1874</text>
  <g font-size="14">
    <rect x="924" y="162" width="364" height="58" rx="10" fill="#FFFFFF" stroke="#E2E0DA"/>
    <text x="942" y="188" font-weight="600" fill="#1B1B18">InvoiceRegistry</text><text x="942" y="208" font-size="12.5" fill="#6B6A63">invoice record, status, duplicate checks</text>
    <rect x="924" y="232" width="364" height="76" rx="10" fill="#FFFFFF" stroke="#0D3B35" stroke-width="1.5"/>
    <text x="942" y="258" font-weight="600" fill="#1B1B18">ReceivableFinance · ERC-721</text><text x="942" y="278" font-size="12.5" fill="#6B6A63">funds and settles; mints the receivable;</text><text x="942" y="295" font-size="12.5" fill="#6B6A63">holds no funds, no admin withdrawal</text>
    <rect x="924" y="320" width="364" height="56" rx="10" fill="#FFFFFF" stroke="#E2E0DA"/>
    <text x="942" y="346" font-weight="600" fill="#1B1B18">Official USDT · 6 decimals</text><text x="942" y="365" font-size="12.5" fill="#6B6A63">investor pays the business; payer repays the holder</text>
  </g>

  <!-- arrows: people -> app -->
  <g stroke="#1B1B18" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M258 163 H330"/>
    <path d="M258 245 H330"/>
    <path d="M258 327 H330"/>
  </g>
  <!-- app -> chain -->
  <path d="M760 230 H900" stroke="#1B1B18" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <rect x="770" y="208" width="120" height="18" fill="#F6F5F2"/>
  <text x="830" y="222" font-size="12" fill="#1B1B18" text-anchor="middle">records verdict</text>
  <!-- verification -> simulated -->
  <path d="M545 402 V470" stroke="#8A887F" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
  <text x="556" y="440" font-size="12" fill="#6B6A63">checks against</text>
  <!-- settlement inside chain -->
  <path d="M1106 308 V320" stroke="#1B1B18" stroke-width="1.6" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- caption -->
  <text x="788" y="492" font-size="12.5" fill="#6B6A63">Verdicts are written by the verifier wallet, not the CRE network.</text>
  <text x="788" y="512" font-size="12.5" fill="#6B6A63">Investors and payers move USDT wallet-to-wallet through</text>
  <text x="788" y="528" font-size="12.5" fill="#6B6A63">ReceivableFinance — the contracts hold nothing.</text>
</svg>
