<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credra demo teleprompter</title>
<style>
	:root { --bg:#111110; --card:#1a1a18; --line:#2c2c29; --ink:#f6f5f2; --dim:#9b978f; --accent:#e9e6df; --warn:#f0b34a; --ok:#6fcf97; }
	* { box-sizing:border-box; }
	html,body { margin:0; background:var(--bg); color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
	body { min-height:100vh; display:flex; flex-direction:column; }
	header { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; }
	header label { font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px; }
	select,input[type=text] { background:#222220; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:14px; }
	input[type=range] { width:110px; }
	button { background:#2a2a27; color:var(--ink); border:1px solid #3a3a36; border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; }
	button:hover { background:#34342f; }
	button.primary { background:var(--ink); color:#111; border-color:var(--ink); font-weight:600; }
	.spacer { flex:1; }
	.clock { font-variant-numeric:tabular-nums; font-size:22px; font-weight:600; min-width:110px; text-align:right; }
	.clock small { color:var(--dim); font-weight:400; font-size:14px; }
	.bar { height:4px; background:var(--line); }
	.bar > div { height:100%; width:0; background:var(--accent); transition:width .2s linear; }
	main { flex:1; display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:0; }
	.stage { padding:28px 40px 40px; display:flex; flex-direction:column; gap:18px; }
	.meta { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; color:var(--dim); font-size:14px; }
	.pill { background:#26261f; border:1px solid var(--line); color:var(--ink); border-radius:999px; padding:4px 12px; font-size:13px; }
	.cue { background:#1f2420; border:1px solid #2f3a31; border-left:4px solid var(--ok); border-radius:10px; padding:14px 18px; font-size:17px; color:#cfe8d6; }
	.cue b { color:var(--ink); }
	.say { font-size:var(--fs,44px); line-height:1.38; letter-spacing:-0.01em; font-weight:500; }
	.count { font-variant-numeric:tabular-nums; font-size:15px; color:var(--dim); }
	.count.over { color:var(--warn); font-weight:600; }
	.next { margin-top:auto; border-top:1px solid var(--line); padding-top:14px; color:var(--dim); font-size:15px; }
	.next b { color:var(--ink); font-weight:500; }
	aside { border-left:1px solid var(--line); background:var(--card); overflow:auto; max-height:calc(100vh - 66px); position:sticky; top:66px; }
	aside h2 { margin:0; padding:14px 16px 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); font-weight:500; }
	.item { display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:11px 16px; }
	.item:hover { background:#222220; }
	.item.active { background:#25251f; box-shadow:inset 3px 0 0 var(--accent); }
	.item .t { font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; }
	.item .c { font-size:13px; margin-top:2px; color:var(--ink); }
	.item.done { opacity:.45; }
	.hint { padding:10px 16px 16px; font-size:12px; color:var(--dim); line-height:1.6; }
	kbd { background:#2a2a27; border:1px solid #3a3a36; border-radius:5px; padding:1px 6px; font-size:11px; color:var(--ink); }
	.mirror .say { transform:scaleX(-1); }
	.overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(17,17,16,.92); z-index:20; font-size:140px; font-weight:700; }
	@media (max-width:900px) { main { grid-template-columns:1fr; } aside { position:static; max-height:none; border-left:0; border-top:1px solid var(--line); } .stage { padding:20px; } }
</style>
</head>
<body>
<header>
	<label>Cut
		<select id="cut">
			<option value="full">Submission cut, 2:49</option>
			<option value="walk">Walkthrough cut, 3:30</option>
			<option value="teaser">Teaser, 0:35</option>
		</select>
	</label>
	<label>Your name <input id="name" type="text" placeholder="[name]" size="12"></label>
	<label>Text size <input id="size" type="range" min="26" max="80" value="44"></label>
	<label><input id="auto" type="checkbox" checked> Auto-advance by time</label>
	<label><input id="mirror" type="checkbox"> Mirror</label>
	<span class="spacer"></span>
	<button id="prev">&larr; Prev</button>
	<button id="next">Next &rarr;</button>
	<button id="reset">Reset</button>
	<button id="start" class="primary">Start (space)</button>
	<div class="clock" id="clock">0:00 <small>/ 2:49</small></div>
</header>
<div class="bar"><div id="prog"></div></div>
<main>
	<section class="stage" id="stage">
		<div class="meta"><span class="pill" id="clip"></span><span id="win"></span><span class="count" id="count"></span></div>
		<div class="cue" id="cue"></div>
		<div class="say" id="say"></div>
		<div class="next" id="nextbox"></div>
	</section>
	<aside>
		<h2>Segments</h2>
		<div id="list"></div>
		<div class="hint">
			<kbd>Space</kbd> start / pause &nbsp; <kbd>&rarr;</kbd> next &nbsp; <kbd>&larr;</kbd> previous<br>
			<kbd>R</kbd> reset &nbsp; <kbd>+</kbd> <kbd>-</kbd> text size &nbsp; <kbd>M</kbd> mirror<br><br>
			Timer turns amber when you run past a segment's window. Aim to finish each line with a second to spare, and keep the total under 4:00.
		</div>
	</aside>
</main>
<div class="overlay" id="overlay"></div>

<script>
const CUTS = {
full: { total:169, segs:[
 {s:0,e:14,clip:'I',cue:'You on camera (or your voice over the landing hero)',text:`Hi, I'm Abhinav, and I built Credra solo here at ETHGlobal Mumbai. Small businesses deliver their work and then wait thirty to ninety days to get paid — and that cash gap is one of the biggest reasons otherwise healthy businesses run out of money.`},
 {s:14,e:32,clip:'A',cue:'Landing hero, then the stats strip',text:`Invoice financing can bridge that gap, but today it is slow and opaque: you hand both your invoice and your money to a middleman you have to trust. Credra replaces that trust with proof. A business tokenizes a verified invoice, an investor funds it instantly in USDT, and every step — verification, funding, repayment — runs onchain on Whitechain. The numbers on this page are live testnet totals.`},
 {s:32,e:44,clip:'B',cue:'The four Approach cards (or one slide, four bullets max)',text:`Four ideas drive the design: verify before funding, duplicates blocked onchain, money moving wallet to wallet instead of through us, and an audit trail on every step. Here is how it works.`},
 {s:44,e:69,clip:'C',cue:'Business: already signed in. Use sample invoice, Submit, approve the Privy prompt',text:`A business signs in with just an email, and we create a wallet for it. It submits an invoice with the document, and the document's fingerprint is registered on Whitechain. Testnet amounts are small, so this invoice is scaled down.`},
 {s:69,e:99,clip:'D',cue:'Terminal: run the CRE command, point at the verdict line',text:`Now verification. This is a Chainlink CRE workflow, run with the CRE CLI. It reads the invoice from Whitechain, asks an external API for the matching record, compares issuer, buyer, amount, due date and document hash, and returns a verdict. Here is a fifty-thousand USDT invoice: eligible. If anything fails it is rejected, and if the API is down it goes to manual review, never to eligible.`},
 {s:99,e:119,clip:'E',cue:'App: Eligible verification record, keep the "Simulated" label visible',text:`Back in the app, the same check is shown field by field. The source is a simulated registry, and it is labelled that way. The verdict is recorded onchain by our verifier wallet, not by the Chainlink network.`},
 {s:119,e:144,clip:'F',cue:'Investor: Approve USDT, Fund invoice, then the explorer transaction',text:`An approved investor funds the invoice in official Tether USDT. The business is paid directly, and the contract holds nothing. Here is the transaction on the Whitechain explorer.`},
 {s:144,e:159,clip:'G',cue:'Repay as the business user, then the timeline; click a name to reveal the address',text:`At the due date the payer repays the full amount to whoever holds the receivable token. The timeline names every actor, and every step links to the explorer.`},
 {s:159,e:169,clip:'H',cue:'End card: logo, 0% platform fee, repo URL',text:`Zero platform fees. Built on Whitechain and Chainlink CRE. Code on GitHub.`}
]},
walk: { total:210, segs:[
 {s:0,e:15,clip:'Intro',cue:'You on the landing hero',text:`Hi, I'm Abhinav, and this is Credra: verified invoice financing in USDT, built on Whitechain with a Chainlink CRE workflow doing the verification.`},
 {s:15,e:40,clip:'Concept',cue:'Landing: the calculator at 50,000 USDT, 4% discount',text:`Here's the problem. A business ships goods, sends an invoice, and then waits thirty days or more to be paid. With Credra, an investor pays most of that invoice today, and gets the full amount back when the buyer pays. On a fifty-thousand USDT invoice at four percent, the business gets forty-eight thousand now, and the investor earns two thousand. The platform fee is zero.`},
 {s:40,e:60,clip:'How it works',cue:'Landing: the five-step stepper',text:`The hard part is trust: why would an investor fund an invoice they can't check? So nothing opens for funding until a Chainlink CRE workflow verifies it against an external record, and every step is recorded onchain.`},
 {s:60,e:85,clip:'Demo 1',cue:'App: email sign-in (already done), Use sample invoice, Submit, approve Privy prompt',text:`Let me show you. I sign in with just an email, and the app creates a wallet for me. I submit an invoice with its document. Testnet amounts are small, so this one is scaled down. The document's fingerprint is registered on Whitechain.`},
 {s:85,e:125,clip:'Demo 2',cue:'Terminal: CRE simulate, then the app Eligible record',text:`Now the verification. This is the CRE workflow, running with the CRE CLI. It reads the invoice from Whitechain, asks an external API for the matching record, and compares issuer, buyer, amount, due date and document hash. This one is a fifty-thousand USDT invoice, and it comes back eligible. If a field doesn't match, it's rejected. If the API is down, it goes to manual review, never to eligible. In the app you see the same check field by field. The source is a simulated registry, and it's labelled that way. The verdict is recorded by our verifier wallet, not by the Chainlink network.`},
 {s:125,e:160,clip:'Demo 3',cue:'Investor: Approve USDT, Fund, then the explorer',text:`Now I switch to an investor. They approve the official Tether USDT and fund the invoice. The business is paid directly, and the contract never holds the money. Here's that transaction on the Whitechain explorer: the official USDT contract, and the funds going to the business wallet.`},
 {s:160,e:190,clip:'Demo 4',cue:'Repay as the business user, then the timeline; click a name',text:`At the due date, the payer repays the full amount to whoever holds the receivable token. The timeline names every actor: the business, our verifier, the investor, and each step links to the explorer, so anyone can audit it.`},
 {s:190,e:210,clip:'Close',cue:'Landing Proof section, then the end card',text:`To be clear about what's real: the contracts and the money movement are real testnet, the verification source is simulated, and the verdict comes from our wallet, not a decentralised network. Next steps are a real data source and a deployed CRE workflow. Zero platform fees, code on GitHub. Thanks for watching.`}
]},
teaser: { total:35, segs:[
 {s:0,e:4,clip:'A',cue:'Landing hero',text:`Businesses wait weeks to get paid. Credra fixes that.`},
 {s:4,e:10,clip:'C',cue:'Submit the sample invoice',text:`Submit an invoice, and its fingerprint is registered on Whitechain.`},
 {s:10,e:17,clip:'D + E',cue:'Split view: CRE terminal and Eligible record, with the "Simulated source" tag',text:`A Chainlink CRE workflow checks it against an external record. Any failure means manual review, never approval.`},
 {s:17,e:25,clip:'F',cue:'Fund click, then the explorer transfer',text:`An investor funds it in official USDT, paid straight to the business. The contract never holds funds.`},
 {s:25,e:31,clip:'G',cue:'Repay, then the named timeline',text:`Repayment goes to the receivable holder, and every step is onchain with a link.`},
 {s:31,e:35,clip:'H',cue:'End card: logo, 0% platform fee, repo URL',text:`Verified invoices. Instant capital. Zero platform fees.`}
]}
};

const $ = id => document.getElementById(id);
const fmt = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };
let cut = 'full', idx = 0, elapsed = 0, running = false, last = 0, raf = 0;

const state = { get segs(){ return CUTS[cut].segs; }, get total(){ return CUTS[cut].total; } };
const nameVal = () => ($('name').value.trim() || '[name]');
const say = s => s.text.replace(/\[name\]/g, nameVal());

function renderList(){
	$('list').innerHTML = state.segs.map((s,i) => `<button class="item" data-i="${i}"><div class="t">${fmt(s.s)} to ${fmt(s.e)}</div><div class="c">${s.clip}: ${s.cue}</div></button>`).join('');
	[...$('list').children].forEach(b => b.onclick = () => jump(+b.dataset.i));
}
function render(){
	const s = state.segs[idx], n = state.segs[idx+1];
	$('clip').textContent = s.clip;
	$('win').textContent = `${fmt(s.s)} to ${fmt(s.e)}  ·  ${s.e - s.s}s window`;
	$('cue').innerHTML = `<b>On screen:</b> ${s.cue}`;
	$('say').textContent = say(s);
	$('nextbox').innerHTML = n ? `<b>Next:</b> ${n.clip} at ${fmt(n.s)}. ${n.cue}` : '<b>Last segment.</b> Hold the end card for a second, then stop.';
	[...$('list').children].forEach((b,i) => { b.classList.toggle('active', i===idx); b.classList.toggle('done', i<idx); });
	const act = $('list').children[idx]; if (act) act.scrollIntoView({block:'nearest'});
	tick();
}
function tick(){
	const s = state.segs[idx];
	$('clock').innerHTML = `${fmt(elapsed)} <small>/ ${fmt(state.total)}</small>`;
	$('prog').style.width = Math.min(100, elapsed / state.total * 100) + '%';
	const left = s.e - elapsed;
	const c = $('count');
	if (left >= 0) { c.textContent = `${Math.ceil(left)}s left in this segment`; c.classList.remove('over'); }
	else { c.textContent = `${Math.ceil(-left)}s over, finish the line`; c.classList.add('over'); }
}
function loop(now){
	if (!running) return;
	elapsed += (now - last) / 1000; last = now;
	if ($('auto').checked) {
		let k = idx; while (k < state.segs.length - 1 && elapsed >= state.segs[k+1].s) k++;
		if (k !== idx) { idx = k; render(); }
	}
	tick();
	if (elapsed >= state.total + 5) { pause(); }
	raf = requestAnimationFrame(loop);
}
function begin(){
	running = true; $('start').textContent = 'Pause (space)'; last = performance.now(); raf = requestAnimationFrame(loop);
}
function start(){
	if (running) return pause();
	if (elapsed === 0 && idx === 0) {
		const o = $('overlay'); o.style.display = 'flex'; let c = 3; o.textContent = c;
		const id = setInterval(() => { c--; if (c === 0) { clearInterval(id); o.style.display = 'none'; begin(); } else o.textContent = c; }, 1000);
	} else begin();
}
function pause(){ running = false; cancelAnimationFrame(raf); $('start').textContent = 'Start (space)'; }
function jump(i){ idx = Math.max(0, Math.min(state.segs.length - 1, i)); elapsed = state.segs[idx].s; render(); }
function reset(){ pause(); idx = 0; elapsed = 0; render(); }
function setCut(c){ cut = c; reset(); renderList(); render(); }

$('cut').onchange = e => setCut(e.target.value);
$('start').onclick = start; $('reset').onclick = reset;
$('next').onclick = () => jump(idx + 1); $('prev').onclick = () => jump(idx - 1);
$('size').oninput = e => { document.documentElement.style.setProperty('--fs', e.target.value + 'px'); try { localStorage.setItem('tp-size', e.target.value); } catch(e){} };
$('mirror').onchange = e => $('stage').classList.toggle('mirror', e.target.checked);
$('name').oninput = () => { try { localStorage.setItem('tp-name', $('name').value); } catch(e){} render(); };
document.addEventListener('keydown', e => {
	if (['INPUT','SELECT'].includes(document.activeElement.tagName) && e.key !== ' ') return;
	if (e.key === ' ') { e.preventDefault(); start(); }
	else if (e.key === 'ArrowRight') jump(idx + 1);
	else if (e.key === 'ArrowLeft') jump(idx - 1);
	else if (e.key === 'r' || e.key === 'R') reset();
	else if (e.key === '+' || e.key === '=') { $('size').value = +$('size').value + 4; $('size').oninput({target:$('size')}); }
	else if (e.key === '-') { $('size').value = +$('size').value - 4; $('size').oninput({target:$('size')}); }
	else if (e.key === 'm' || e.key === 'M') { $('mirror').checked = !$('mirror').checked; $('mirror').onchange({target:$('mirror')}); }
});
try { const n = localStorage.getItem('tp-name'); if (n) $('name').value = n; const z = localStorage.getItem('tp-size'); if (z) { $('size').value = z; $('size').oninput({target:$('size')}); } } catch(e){}
renderList(); render();
</script>
</body>
</html>
